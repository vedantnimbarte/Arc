[package]
name = "arc-ptyhost"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# The host executable itself is `apps/desktop/src/bin/arc-ptyhost.rs`: Tauri
# bundles every binary of the app crate, and only of the app crate.

[dependencies]
anyhow.workspace = true
arc-pty.workspace = true
dirs.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

# Same-user access to the IPC endpoint: a user-only DACL on the named pipe,
# and a check that the pipe we connect to is owned by us.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# getuid / setsid for the socket's ownership checks and the detached launch.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
