[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "rust/pty",
    "rust/session-manager",
    "rust/filesystem",
    "rust/git",
    "rust/http-client",
    "rust/ssh",
    "rust/project-config",
    "rust/git-host",
    "rust/lsp",
    "rust/wingman",
    "rust/claude-code",
    "rust/db",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ARC contributors"]

[workspace.dependencies]
# Async
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Errors / logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Filesystem / IDs
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "6"

# Terminal
portable-pty = "0.9"
bytes = "1.7"

# SSH client (pure-Rust) + key generation. russh handles the wire protocol and
# re-exports ssh-key as `russh::keys::ssh_key`, which is where key generation
# and serialisation now come from. Depending on ssh-key directly would pull a
# second, incompatible copy of it — russh pins 0.7.0-rc, the latest release on
# crates.io is 0.6, and the two do not share types.
#
# `ring` rather than russh's default `aws-lc-rs` backend: aws-lc-sys builds
# BoringSSL from source and needs NASM plus a working C toolchain, which fails
# on a stock Windows dev machine and would make a native toolchain a
# prerequisite for `cargo check` on a repo that otherwise needs none. ring
# ships prebuilt and covers the algorithms we negotiate.
#
# There is no separate russh-keys any more — it was folded into russh as
# `russh::keys` (its own last publish was an 0.50 beta).
russh = { version = "0.63", default-features = false, features = ["ring"] }
# SFTP client for remote workspaces, layered over a russh channel stream.
russh-sftp = "2.4"
# Both must match what ssh-key 0.7 uses, or the RNG traits are different
# types with the same names. rand_core supplies `UnwrapErr`; `OsRng` moved out
# of rand_core in 0.10 and now lives in getrandom as `SysRng`.
rand_core = "0.10"
getrandom = "0.4"
base64 = "0.22"

# Native file dialogs
rfd = "0.15"

# Open URLs / paths in the user's default handler (system browser, file manager, …)
open = "5"

# Filesystem watcher + walker
notify = "6"
walkdir = "2"

# Full-text indexing — used by `arc-filesystem::index` to back fs_search.
# 0.26 split stopword filtering's `Language` type out under a `stemmer`
# feature that 0.22 didn't need explicitly — "stopwords" alone no longer
# compiles on its own.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "stopwords", "stemmer"] }
sha2 = "0.10"

# OS credential vault (Keychain / Credential Manager / Secret Service).
# `apple-native` and `windows-native` use built-in OS APIs with no extra
# system deps; on Linux `sync-secret-service` shells out to libsecret.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

# HTTP / streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"

# TOML — used by arc-project-config to parse .arc/config.toml.
toml = "0.8"

# Persistence
# `postgres` / `mysql` are here for arc-db (the database client tab); the
# session store itself only ever touches sqlite. TLS uses rustls with the
# OS trust store so a server behind a corporate CA still verifies.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql", "tls-rustls-ring-native-roots", "macros", "migrate", "chrono"] }
# Force the bundled libsqlite3 so the binary doesn't need system sqlite on Windows.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"

# Tauri (workspace-pinned for app crate)
# Tracked: RUSTSEC/Dependabot flags `glib` <0.20 (GHSA-wrw7-89jp-8q8g,
# Linux-only, via tauri-runtime-wry -> wry -> webkit2gtk's gtk-rs 0.18
# stack). No fix here yet — 2.11.5 is the latest stable tauri 2.x, and
# `cargo update` (whole workspace) doesn't move wry/glib at all under it.
# Forcing a `[patch]` to an untested gtk-rs version risks the native webview
# layer for a Linux-only advisory; wait for an upstream tauri/wry release.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Internal crates
arc-pty = { path = "rust/pty" }
arc-session-manager = { path = "rust/session-manager" }
arc-filesystem = { path = "rust/filesystem" }
arc-git = { path = "rust/git" }
arc-http-client = { path = "rust/http-client" }
arc-ssh = { path = "rust/ssh" }
arc-project-config = { path = "rust/project-config" }
arc-git-host = { path = "rust/git-host" }
arc-lsp = { path = "rust/lsp" }
arc-wingman = { path = "rust/wingman" }
arc-claude-code = { path = "rust/claude-code" }
arc-db = { path = "rust/db" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Drops unwind tables for a further binary-size win. If a panicking Tauri
# command handler ever needs to fail just that one IPC call instead of taking
# the whole process down, revert this — verified no catch_unwind in our own
# crates relies on it, but Tauri's own dispatcher wasn't fully auditable here.
panic = "abort"
strip = true
