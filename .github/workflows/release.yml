name: release

# Builds signed-if-configured installers for Linux, macOS (Intel + Apple
# Silicon), and Windows, and uploads them to a draft GitHub Release. Trigger by
# pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Signing is not wired up yet — the produced installers are UNSIGNED, so macOS
# Gatekeeper and Windows SmartScreen will warn on first run (see INSTALLATION.md
# for the bypass). To sign later, add the secrets tauri-action documents
# (APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / notarization creds; Windows
# WINDOWS_CERTIFICATE) and they flow through automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # webkit2gtk-4.1 pins us to 22.04, not 24.04
            target: ''
            args: ''
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-13 # Intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ARC ${{ github.ref_name }}
          releaseBody: 'Unsigned builds — see INSTALLATION.md for the macOS/Windows first-run bypass.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
