name: release

# Builds signed-if-configured installers for Linux, macOS (Intel + Apple
# Silicon), and Windows, and uploads them to a draft GitHub Release. Trigger by
# pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# In-app updates: `bundle.createUpdaterArtifacts` is on, so this job also
# emits signed `.sig` files and the `latest.json` manifest clients poll at
# https://github.com/vedantnimbarte/Arc/releases/latest/download/latest.json.
# Two repo secrets must exist for that to work — TAURI_SIGNING_PRIVATE_KEY
# (contents of the private key from `pnpm tauri signer generate`) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# The release ends up a DRAFT, so `/releases/latest/` skips it and no client is
# offered the update until you publish it by hand. That is enforced by the
# `draft` job below rather than by `releaseDraft: true` — the flag is set, but
# it does not survive a build matrix, and both v0.4.0 and v0.5.0 published
# themselves the moment their last platform finished.
#
# Code signing (a separate thing) is not wired up yet — the produced installers are UNSIGNED, so macOS
# Gatekeeper and Windows SmartScreen will warn on first run (see INSTALLATION.md
# for the bypass). To sign later, add the secrets tauri-action documents
# (APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / notarization creds; Windows
# WINDOWS_CERTIFICATE) and they flow through automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # webkit2gtk-4.1 pins us to 22.04, not 24.04
            target: ''
            args: ''
          # Apple Silicon only — Intel Macs are not a target we build for.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Without these the build still succeeds but ships
          # no `.sig` files, and every client rejects the update as unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ARC ${{ github.ref_name }}
          releaseBody: 'Unsigned builds — see INSTALLATION.md for the macOS/Windows first-run bypass.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Put the release back into draft once every platform has uploaded.
  #
  # `releaseDraft: true` above is not enough on its own: with a build matrix the
  # three jobs race to create-or-reuse one release, and it comes out published —
  # which is how v0.4.0 and v0.5.0 both reached users unreviewed. Asserting the
  # state here is the only version that holds, because it runs once and last.
  #
  # `if: always()` is deliberate. A partly-failed build is exactly when a
  # half-populated release must not be live, so this still runs when a platform
  # fails; it just can't run before the others have finished uploading.
  draft:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release for $TAG — every build job must have failed."
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" --draft
          echo "$TAG is a draft. Publish it once you've installed it and looked."
