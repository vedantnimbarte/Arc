name: release

# Builds signed-if-configured installers for Linux, macOS (Intel + Apple
# Silicon), and Windows, and uploads them to a draft GitHub Release. Trigger by
# pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# In-app updates: `bundle.createUpdaterArtifacts` is on, so this job also
# emits signed `.sig` files and the `latest.json` manifest clients poll at
# https://github.com/vedantnimbarte/Arc/releases/latest/download/latest.json.
# Two repo secrets must exist for that to work — TAURI_SIGNING_PRIVATE_KEY
# (contents of the private key from `pnpm tauri signer generate`) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# The release ends up a DRAFT, so `/releases/latest/` skips it and no client is
# offered the update until you publish it by hand. That is enforced by the
# `draft` job below rather than by `releaseDraft: true` — the flag is set, but
# it does not survive a build matrix, and both v0.4.0 and v0.5.0 published
# themselves the moment their last platform finished.
#
# Code signing (a separate thing) switches itself on per platform once its
# secrets exist — docs/CODE_SIGNING.md has the secret names and how to make
# each value. Until then the installers are UNSIGNED, so macOS Gatekeeper and
# Windows SmartScreen warn on first run (INSTALLATION.md has the bypass), and
# the release notes say so.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # webkit2gtk-4.1 pins us to 22.04, not 24.04
            target: ''
            args: ''
          # Apple Silicon only — Intel Macs are not a target we build for.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    # Only whether the signing secrets exist, never their values: the steps
    # that need a value read it themselves.
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile

      # The bundler treats a macOS signing variable that is *set* as present,
      # and a secret that doesn't exist still arrives as an empty string — so
      # export only the ones with a value. With none, this does nothing and
      # the build stays unsigned.
      - name: Export macOS signing env
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Contents of AuthKey_<key id>.p8; the bundler wants a file path.
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__ARC_EOF__"; echo "${!v}"; echo "__ARC_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      # Windows: import the PFX into the user store and point the bundler at it
      # through a config overlay (`tauri build --config`), so tauri.conf.json
      # carries no thumbprint and an unsigned build needs no special case.
      - name: Import Windows signing certificate
        id: wincert
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $overlay = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $overlay
          "args=--config $overlay" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Without these the build still succeeds but ships
          # no `.sig` files, and every client rejects the update as unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ARC ${{ github.ref_name }}
          # Every matrix job computes the same text; whichever one creates the
          # release sets it.
          releaseBody: >-
            ${{ env.HAS_APPLE_SIGNING == 'true' && env.HAS_WINDOWS_SIGNING == 'true' && 'Signed builds — macOS builds are signed and notarized, Windows builds are Authenticode-signed.'
            || env.HAS_APPLE_SIGNING == 'true' && 'macOS builds are signed and notarized. Windows builds are unsigned — see INSTALLATION.md for the first-run bypass.'
            || env.HAS_WINDOWS_SIGNING == 'true' && 'Windows builds are Authenticode-signed. macOS builds are unsigned — see INSTALLATION.md for the first-run bypass.'
            || 'Unsigned builds — see INSTALLATION.md for the macOS/Windows first-run bypass.' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.args }}

  # Put the release back into draft once every platform has uploaded.
  #
  # `releaseDraft: true` above is not enough on its own: with a build matrix the
  # three jobs race to create-or-reuse one release, and it comes out published —
  # which is how v0.4.0 and v0.5.0 both reached users unreviewed. Asserting the
  # state here is the only version that holds, because it runs once and last.
  #
  # `if: always()` is deliberate. A partly-failed build is exactly when a
  # half-populated release must not be live, so this still runs when a platform
  # fails; it just can't run before the others have finished uploading.
  draft:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release for $TAG — every build job must have failed."
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" --draft
          echo "$TAG is a draft. Publish it once you've installed it and looked."
