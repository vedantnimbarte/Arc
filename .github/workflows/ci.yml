name: ci

# Typecheck, tests, and a full cargo check on every PR and on main. The Linux
# webkit/gtk dev libs are needed even for `cargo check` because the desktop
# crate links against Tauri's system webview.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      # Tauri's generate_context! macro validates that frontendDist exists at
      # compile time, so the frontend must be built before any cargo step.
      - run: pnpm --filter @arc/frontend build
      - run: cargo check --workspace
      - run: cargo test --workspace

  # Smoke tests against the real app (apps/e2e): launch, type into a terminal,
  # relaunch and type into the restored tabs, open the heavy panels. Driven by
  # tauri-driver, which has no macOS backend. `pnpm e2e` builds the debug
  # binary itself, with the test hook compiled in.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # Non-blocking on Windows for now: on GitHub's hosted runners msedgedriver
    # never gets a session ("DevToolsActivePort file doesn't exist") — the
    # WebView2 process doesn't come up under the runner — while the same suite
    # passes on a developer Windows machine. Linux stays required.
    continue-on-error: ${{ matrix.platform == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: cargo install tauri-driver --locked

      # msedgedriver must match the installed WebView2 runtime exactly.
      - name: Install msedgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $dir >> $env:GITHUB_PATH

      - run: pnpm install --frozen-lockfile

      - name: Run e2e
        if: runner.os == 'Windows'
        run: pnpm e2e
      - name: Run e2e
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
