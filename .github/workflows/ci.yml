name: ci

# Typecheck, tests, and a full cargo check on every PR and on main. The Linux
# webkit/gtk dev libs are needed even for `cargo check` because the desktop
# crate links against Tauri's system webview.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      # Tauri's generate_context! macro validates that frontendDist exists at
      # compile time, so the frontend must be built before any cargo step.
      - run: pnpm --filter @arc/frontend build
      - run: cargo check --workspace
      - run: cargo test --workspace
