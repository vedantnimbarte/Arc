[package]
name = "arc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ARC — terminal, editor & developer workspace (Tauri shell)"
# Two binaries live here (`src/bin/arc-ptyhost.rs` is the other); `cargo run`
# and `tauri dev` need to be told which one is the app.
default-run = "arc-desktop"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# `protocol-asset`: the markdown preview loads local images (scoped at runtime,
# see `fs_allow_asset_dir`).
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }

arc-pty = { workspace = true }
arc-ptyhost = { workspace = true }
arc-session-manager = { workspace = true }
arc-filesystem = { workspace = true }
arc-git = { workspace = true }
arc-http-client = { workspace = true }
arc-ssh = { workspace = true }
arc-project-config = { workspace = true }
arc-git-host = { workspace = true }
arc-lsp = { workspace = true }
arc-dap = { workspace = true }
arc-wingman = { workspace = true }
arc-claude-code = { workspace = true }
arc-db = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
fontdb = "0.18"
keyring = { workspace = true }
open = { workspace = true }
rfd = { workspace = true }
uuid = { workspace = true }

[features]
# By default, Tauri sets up a window. Enable `custom-protocol` for release.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
